# Human-readable project metadata for Codex. This is not runtime config.

[project]
name = "slice_soft_demo"
repository = "polarbao/slice_soft_demo"
main_app_path = "src/slicer_core"
current_branch_or_ref = "feature/14-slicer-capability-package"
formal_docs = "docs/slice"
codex_tasks = "docs/codex_task"
archive_docs = "docs/archive/2026-06-30_slicer_legacy"
# 任务状态以任务清单内的状态列为唯一真源，本文件只指向入口。
# 2026-08-11 裁定的执行顺序与优先级（权威记录见 next_sequence_decision §3.5）：
# 【已完成】R-F-01 平滑顶点法线；R-F-02 基线重固化（含 R-C-00）。
# 【已完成】16-00-01..04 Stage 16 准入复核，结论 PARTIAL GO。
# 【已完成】16A-01 合成 fixture 和差异 schema。
# 【已完成】16A-02 STL-only GeometryOccupancyPolicy 和 Provider 合同，Legacy Golden 零漂移。
# 【已完成】16A-03 Layer Slab Candidate，仅限 relief_heightfield，Legacy Golden 零漂移。
# 【已完成】16A-04 边界自适应 2x2 Candidate，S3/S4 Package/RIP PASS，Legacy Golden 零漂移。
# 【当前主线】16A-05 机器可读候选矩阵；用户同时授权 16B/16C/16D，当前可独立准备并
#   实施 16B-01、16C-01；16D 仍等待 16A-06 与必要的 16B 候选，候选默认关闭。
# 【可延后】不满足触发条件不得开工：
#   T-A-05B-02+03（等用户删除确认，捆绑执行）、T-A-04（等外部 RIP 证据）、
#   R-C-01/02（等 R-F-02 数据与打印侧回签）、R-D/R-E（无触发迹象）、
#   H-G 组（等 5 项产品 Gate）、CI 组（等解除暂缓与 runner 形态）、
#   16C-10（13B 产品输入，恒 INPUT_OPEN）。16C-08 所需 Worker/Facade 边界已由
#   Stage 14 切片侧收口提供，不再被 14D 阻塞，仍须经 16-00 carry-in 审计后排期。
# R-C-00 已并入 R-F-02，不再单独立卡。
current_task_file = "docs/codex_task/current/TASKS_16_切片几何采样甲片接触姿态与性能专项任务清单.md"
previous_task_file = "docs/codex_task/current/TASKS_RENDER_模型显示与LOD修复补充任务清单.md"
next_sequence_decision = "docs/slice/DOC/DOC_DECISION_16_00_Stage16准入Gate口径与R_F线排期裁定.md"
active_specialty_cards = [
  "docs/codex_task/current/TASKS_RENDER_模型显示与LOD修复补充任务清单.md",
  "docs/codex_task/current/TASKS_TIFF_默认后端切换与对齐根治任务清单.md",
  "docs/codex_task/current/TASKS_HOSTFLOW_宿主业务流程与场景生命周期补齐任务清单.md",
  "docs/codex_task/current/TASKS_CI_冻结面工程保护任务清单.md",
]
language = "zh-CN"
role = "senior C++20 / Qt 5.15 / CMake slicing-software architect"

[workspace]
primary_paths = [
  "AGENTS.md",
  ".agents/AGENTS.md",
  ".agents/docs",
  ".agents/skills",
  "docs/slice",
  "docs/codex_task/current",
  "src/slicer_core",
  "apps/slicer_cli",
  "apps/slicer_debug_ui",
  "scripts",
  "tests",
]
historical_reference_paths = [
  "docs/archive/2026-06-30_slicer_legacy",
  "docs/codex_task/archive",
]

[verification]
build = "cmake --build build --config Debug"
test = "ctest --test-dir build -C Debug --output-on-failure"
quick = 'powershell -ExecutionPolicy Bypass -File .\scripts\run_ci_quick.ps1'
ui_smoke = '.\build\apps\slicer_debug_ui\Debug\slicer_debug_ui.exe --self-test'
openvdb_cli = 'powershell -ExecutionPolicy Bypass -File .\scripts\run_09p_cli_experimental_tests.ps1'
openvdb_pipeline = 'powershell -ExecutionPolicy Bypass -File .\scripts\run_09p_experimental_pipeline_tests.ps1'

[risk]
pause_before = [
  "destructive filesystem operations",
  "dependency upgrades or new third-party libraries",
  "changing ViewData response structure (requires controlled revision per 14F-R1/R2/R3)",
  "removing the handwritten TIFF writer (T-A-05B-03 needs explicit deletion approval)",
  "turning any Stage 16 card READY before its task dependencies and task-specific authorization are satisfied",
  "switching any Stage 16 candidate to production default (16D-05 needs explicit authorization)",
  "deleting files",
  "rewriting git history",
  "production data changes",
  "hardware or device control",
  "enabling OpenVDB by default",
  "changing p0.rgbwsv.2 or RGBWSV channel semantics",
]

[commit_style]
format = "type(scope): 中文说明"
examples = [
  "docs(codex): 更新AI协作规则与任务入口",
  "fix(slice): 收口实验报告schema校验",
]
